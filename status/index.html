<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Punishment Status | Monitor Real-time</title>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #0a0a0c;
      --bg-gradient: radial-gradient(circle at center, #111116 0%, #0a0a0c 100%);
      --primary-red: #ff3b3b;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --online: #43b581;
      --offline: #f04747;
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-border: rgba(255, 255, 255, 0.05);
      --funczero-purple: #9C6ADE;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', system-ui, sans-serif; }

    body {
      background-color: var(--bg-dark);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px;
    }

    .header { text-align: center; margin-bottom: 30px; }
    .logo { width: 60px; height: 60px; border-radius: 18px; margin-bottom: 12px; }
    h1 { font-size: 2.2rem; font-weight: 800; color: var(--primary-red); letter-spacing: -1px; }

    /* Estilização para o Iframe do Badge */
    .status-badge-container {
      margin-bottom: 40px;
      display: flex;
      justify-content: center;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
      gap: 20px;
      width: 100%;
      max-width: 900px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: 16px;
      display: flex;
      flex-direction: column;
      gap: 15px;
      min-height: 200px;
    }

    .card-header { display: flex; justify-content: space-between; align-items: center; color: var(--text-muted); font-size: 0.8rem; font-weight: 600; text-transform: uppercase; }
    .card-value { font-size: 1.8rem; font-weight: 700; }

    /* Ajuste para o Iframe de Histórico */
    .history-frame {
      width: 100%;
      height: 100px; /* Reduzido para caber no seu card */
      border-radius: 8px;
      overflow: hidden;
    }

    footer { margin-top: auto; padding-top: 60px; text-align: center; font-size: 0.75rem; color: #555; width: 100%; }
    .dev-signature a { text-decoration: none; font-weight: 700; color: var(--funczero-purple); }
  </style>
</head>
<body>

  <header class="header">
    <img src="../logo.png" class="logo" onerror="this.src='https://ui-avatars.com/api/?name=P&background=ff3b3b&color=fff'" />
    <h1>Punishment</h1>
  </header>

  <div class="status-badge-container">
    <iframe src="https://status.punbot.xyz/badge?theme=dark" width="250" height="30" frameborder="0" scrolling="no" style="color-scheme: normal;"></iframe>
  </div>

  <main class="grid">
    <div class="card">
      <div class="card-header">
        <span>Sistemas & Uptime</span>
        <i data-lucide="shield-check"></i>
      </div>
      <iframe src="https://status.punbot.xyz" width="100%" height="150" frameborder="0" style="filter: brightness(0.9);"></iframe>
      <div class="card-header" style="margin-top: auto;">
        <a href="https://status.punbot.xyz" target="_blank" style="color: var(--primary-red); text-decoration: none; font-size: 0.7rem;">VER DETALHES COMPLETOS →</a>
      </div>
    </div>

    <div class="card">
      <div class="card-header">
        <span>Alcance do Bot</span>
        <i data-lucide="activity"></i>
      </div>
      <div style="display: flex; gap: 20px;">
        <div>
            <span style="font-size: 0.7rem; color: var(--text-muted);">GUILDAS</span>
            <div class="card-value" id="guilds">--</div>
        </div>
        <div>
            <span style="font-size: 0.7rem; color: var(--text-muted);">USUÁRIOS</span>
            <div class="card-value" id="users">--</div>
        </div>
      </div>
      <div class="card-header" style="margin-top: auto;">
        <span>Última atualização</span>
        <span id="updated">--</span>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 Punishment. Todos os direitos reservados.</p>
    <p class="dev-signature">Dev by <a href="https://funczero.xyz" target="_blank">FuncZero</a></p>
  </footer>

  <script>
    lucide.createIcons();

    async function updateBotStats() {
      try {
        const [gRes, uRes] = await Promise.all([
          fetch('https://punbot.xyz/api/bot/guilds').catch(() => ({ json: () => ({ count: 0 }) })),
          fetch('https://punbot.xyz/api/bot/users').catch(() => ({ json: () => ({ total: 0 }) }))
        ]);
        const gData = await gRes.json();
        const uData = await uRes.json();

        document.getElementById('guilds').textContent = (gData.count || 0).toLocaleString();
        document.getElementById('users').textContent = (uData.total || uData.count || 0).toLocaleString();
        
        const now = new Date();
        document.getElementById('updated').textContent = `${now.getHours()}:${now.getMinutes().toString().padStart(2, '0')}`;
      } catch (err) {
        console.error("Erro ao buscar stats do bot:", err);
      }
    }

    updateBotStats();
    setInterval(updateBotStats, 60000);
  </script>

  <script src="https://uptime.betterstack.com/widgets/announcement.js" data-id="239395" async="async" type="text/javascript"></script>
</body>
</html>
