<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Punishment Status</title>

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0a0c;
      --bg-gradient: radial-gradient(circle at center, #111116 0%, #0a0a0c 100%);
      --primary-red: #ff3b3b;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --online: #43b581;
      --offline: #f04747;
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-border: rgba(255, 255, 255, 0.05);
      --border-soft: rgba(255, 255, 255, 0.05);
      --funczero-purple: #9C6ADE;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-dark);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* HEADER */
    .nav-header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      margin-top: 20px;
    }

    .logo { width: 40px; height: 40px; border-radius: 10px; }

    .btn-contact {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    /* BANNER PRINCIPAL */
    .main-banner {
      width: calc(100% - 40px);
      max-width: 860px;
      background: rgba(67, 181, 129, 0.05);
      border: 1px solid rgba(67, 181, 129, 0.1);
      padding: 20px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
      border-left: 4px solid var(--online);
    }

    .banner-icon { color: var(--online); width: 24px; height: 24px; }
    .banner-text { font-size: 1.25rem; font-weight: 700; }

    /* CONTAINER DE SERVIÇOS */
    .status-container {
      width: calc(100% - 40px);
      max-width: 860px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 60px;
    }

    .service-group {
      padding: 24px;
      border-bottom: 1px solid var(--card-border);
    }
    .service-group:last-child { border-bottom: none; }

    .group-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .group-name { color: var(--text-muted); font-size: 0.9rem; font-weight: 500; }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(67, 181, 129, 0.1);
      color: var(--online);
    }

    /* MONITOR INDIVIDUAL */
    .monitor-row { margin-bottom: 10px; }
    
    .monitor-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }
    
    .monitor-title { display: flex; align-items: center; gap: 10px; font-weight: 600; font-size: 1rem; }
    .uptime-percent { color: var(--online); font-size: 0.85rem; font-weight: 500; }

    /* BARRINHAS DE HISTÓRICO */
    .history-grid {
      display: grid;
      grid-template-columns: repeat(30, 1fr);
      gap: 4px;
      height: 34px;
    }

    .history-bar {
      background: var(--online);
      border-radius: 2px;
      opacity: 0.8;
    }
    .history-bar.down { background: var(--offline); }
    .history-bar.empty { background: var(--card-border); }

    .history-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 8px;
      color: #555;
      font-size: 0.75rem;
    }

    footer {
      width: 100%;
      padding: 20px;
      text-align: center;
      font-size: 0.75rem;
      border-top: 1px solid var(--border-soft);
      margin-top: auto;
    }
    .footer-links { margin-bottom: 10px; display: flex; justify-content: center; gap: 18px; }
    .footer-links a { color: var(--text-muted); text-decoration: none; }
    .dev-signature a { font-weight: 700; color: var(--funczero-purple); text-decoration: none; }

    @media (max-width: 600px) {
      .history-grid { gap: 2px; }
    }
  </style>
</head>
<body>

  <header class="nav-header">
    <img src="../logo.png" alt="P" class="logo" onerror="this.src='https://ui-avatars.com/api/?name=P&background=ff3b3b&color=fff'">
    <button class="btn-contact">Get in touch <i data-lucide="chevron-down" style="width:14px"></i></button>
  </header>

  <div id="statusBanner" class="main-banner">
    <i data-lucide="check-circle-2" class="banner-icon"></i>
    <span class="banner-text" id="bannerText">Todos os sistemas operacionais</span>
  </div>

  <main class="status-container" id="statusContent">
    <div style="padding: 60px; text-align: center; color: var(--text-muted);">
      Sincronizando serviços...
    </div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="../terms">Termos</a>
      <a href="../privacy">Privacidade</a>
      <a href="../status">Status</a>
    </div>
    <p>© 2026 Punishment. All rights reserved.</p>
    <p class="dev-signature" style="margin-top:8px">Dev by <a href="https://funczero.xyz" target="_blank">FuncZero</a></p>
  </footer>

  <script>
    lucide.createIcons();

    async function loadBetterStack() {
      const content = document.getElementById('statusContent');
      
      try {
        // Buscando o JSON real da sua página de status
        const response = await fetch('https://status.punbot.xyz/status-page/v2/services.json');
        if (!response.ok) throw new Error('Falha ao carregar');
        
        const data = await response.json();
        content.innerHTML = ''; // Limpa o carregando

        data.services.forEach(service => {
          const isUp = service.status === 'up';
          
          // Cria o bloco do grupo (Bot, API, etc)
          const groupDiv = document.createElement('div');
          groupDiv.className = 'service-group';
          
          groupDiv.innerHTML = `
            <div class="group-header">
              <span class="group-name">${service.name.split(' ')[0]}</span>
              <div class="status-pill" style="${!isUp ? 'color: var(--offline); background: rgba(240,71,71,0.1)' : ''}">
                <i data-lucide="${isUp ? 'check-circle-2' : 'alert-circle'}" style="width:12px"></i>
                ${isUp ? 'Operational' : 'Down'}
              </div>
            </div>

            <div class="monitor-row">
              <div class="monitor-info">
                <div class="monitor-title">
                  <i data-lucide="check-circle-2" style="width:18px; color: var(--online)"></i>
                  ${service.name}
                </div>
                <div class="uptime-percent">100% uptime</div>
              </div>
              
              <div class="history-grid">
                ${Array(30).fill(0).map((_, i) => `<div class="history-bar ${i === 29 && !isUp ? 'down' : ''}"></div>`).join('')}
              </div>

              <div class="history-footer">
                <span>30 days ago</span>
                <span>Today</span>
              </div>
            </div>
          `;
          content.appendChild(groupDiv);
        });

        lucide.createIcons();

      } catch (err) {
        content.innerHTML = `<div style="padding:40px; text-align:center; color:var(--offline)">Erro ao sincronizar com Better Stack.</div>`;
      }
    }

    loadBetterStack();
    setInterval(loadBetterStack, 60000);
  </script>
</body>
</html>
