<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Punishment Status</title>

  <script src="https://unpkg.com/lucide@latest"></script>

  <style>
    :root {
      --bg-dark: #0a0a0c;
      --bg-gradient: radial-gradient(circle at center, #111116 0%, #0a0a0c 100%);
      --primary-red: #ff3b3b;
      --primary-red-hover: #ff5c5c;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --online: #43b581;
      --offline: #f04747;
      --unknown: #faa61a;
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-border: rgba(255, 255, 255, 0.05);
      --card-hover: rgba(255, 255, 255, 0.04);
      --funczero-purple: #9C6ADE;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      font-family: 'Inter', system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg-dark);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 60px 20px 0px 20px;
    }

    .header {
      text-align: center;
      margin-bottom: 40px;
    }

    .logo-container {
      position: relative;
      display: inline-block;
      margin-bottom: 16px;
    }

    .logo {
      width: 60px;
      height: 60px;
      object-fit: contain;
      border-radius: 18px;
      transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .logo-container:hover .logo {
      transform: scale(1.1) rotate(5deg);
    }

    h1 {
      font-size: 2.5rem;
      font-weight: 800;
      letter-spacing: -1px;
      margin-bottom: 8px;
      color: var(--primary-red);
    }

    .status-indicator {
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 10px 24px;
      border-radius: 100px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      margin-bottom: 50px;
      font-weight: 500;
      font-size: 0.9rem;
      transition: all 0.3s ease;
    }

    .status-dot {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      position: relative;
    }

    .status-dot::after {
      content: "";
      position: absolute;
      inset: -2px;
      border-radius: 50%;
      background-color: inherit;
      opacity: 0.4;
      animation: pulse-ring 2s infinite;
    }

    @keyframes pulse-ring {
      0% { transform: scale(1); opacity: 0.5; }
      70% { transform: scale(1.8); opacity: 0; }
      100% { transform: scale(1); opacity: 0; }
    }

    .status-operational { color: var(--online); border-color: rgba(67, 181, 129, 0.2); }
    .status-offline     { color: var(--offline); border-color: rgba(240, 71, 71, 0.2); }
    .status-unknown     { color: var(--unknown); border-color: rgba(250, 166, 26, 0.2); }

    /* Novo Layout de Grid para Status Rows */
    .status-container {
      width: 100%;
      max-width: 800px;
      display: flex;
      flex-direction: column;
      gap: 16px;
      margin-bottom: 60px;
    }

    .status-card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: 12px;
      transition: all 0.25s ease;
    }

    .status-card:hover {
      background: var(--card-hover);
      border-color: rgba(255, 255, 255, 0.1);
    }

    .status-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
    }

    .component-name {
      font-weight: 600;
      font-size: 1rem;
      color: var(--text-main);
    }

    .component-status {
      font-size: 0.85rem;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Barras de Histórico */
    .history-bars {
      display: flex;
      gap: 3px;
      height: 34px;
      align-items: flex-end;
    }

    .bar {
      flex: 1;
      height: 100%;
      border-radius: 2px;
      min-width: 4px;
      background-color: var(--online);
      opacity: 0.8;
      transition: opacity 0.2s;
    }

    .bar:hover {
      opacity: 1;
    }

    .bar.down { background-color: var(--offline); }
    .bar.warn { background-color: var(--unknown); }
    .bar.empty { background-color: rgba(255,255,255,0.1); }

    .status-card-footer {
      display: flex;
      justify-content: space-between;
      margin-top: 10px;
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    footer {
      width: 100%;
      padding: 30px 20px;
      text-align: center;
      font-size: 0.75rem;
      color: #555;
      border-top: 1px solid var(--card-border);
      margin-top: auto;
    }

    .footer-links {
      margin-bottom: 10px;
      display: flex;
      justify-content: center;
      gap: 18px;
      flex-wrap: wrap;
    }

    .footer-links a {
      color: var(--text-muted);
      text-decoration: none;
      transition: 0.2s;
    }

    .footer-links a:hover {
      color: var(--primary-red);
    }

    .dev-signature {
      margin-top: 8px;
      color: #777;
    }

    .dev-signature a {
      text-decoration: none;
      font-weight: 700;
      color: var(--funczero-purple);
      transition: opacity 0.2s ease;
    }

    @media (max-width: 600px) {
      .bar:nth-child(-n+15) { display: none; } /* Esconde metade das barras no mobile */
    }
  </style>
</head>
<body>

  <header class="header">
    <div class="logo-container">
      <img src="../logo.png" alt="Punishment Logo" class="logo" onerror="this.src='https://ui-avatars.com/api/?name=P&background=ff3b3b&color=fff'" />
    </div>
    <h1>Punishment</h1>
  </header>

  <div id="statusIndicator" class="status-indicator status-unknown">
    <div class="status-dot" id="statusDot" style="background-color: var(--unknown)"></div>
    <span id="statusText">Verificando...</span>
  </div>

  <main class="status-container">
    
    <div class="status-card">
      <div class="status-card-header">
        <span class="component-name">Bot Operations</span>
        <span class="component-status" id="botStatusBadge" style="color: var(--online)">
          Normal <i data-lucide="check-circle-2" style="width: 14px;"></i>
        </span>
      </div>
      <div class="history-bars" id="botBars"></div>
      <div class="status-card-footer">
        <span>30 dias atrás</span>
        <span id="guildsCount">-- Servidores</span>
        <span>Hoje</span>
      </div>
    </div>

    <div class="status-card">
      <div class="status-card-header">
        <span class="component-name">API Gateway</span>
        <span class="component-status" id="apiStatusBadge" style="color: var(--online)">
          Normal <i data-lucide="check-circle-2" style="width: 14px;"></i>
        </span>
      </div>
      <div class="history-bars" id="apiBars"></div>
      <div class="status-card-footer">
        <span>30 dias atrás</span>
        <span id="usersCount">-- Usuários</span>
        <span>Hoje</span>
      </div>
    </div>

    <div style="text-align: center; font-size: 0.8rem; color: var(--text-muted);">
        Última verificação: <span id="updatedTime">--:--</span>
    </div>

  </main>

  <footer>
    <div class="footer-links">
      <a href="../terms">Termos</a>
      <a href="../privacy">Privacidade</a>
    </div>
    <p>© 2026 Punishment. All rights reserved.</p>
    <p class="dev-signature">Dev by <a href="https://funczero.xyz" target="_blank">FuncZero</a></p>
  </footer>

  <script>
    lucide.createIcons();

    // Função para gerar as barras de histórico (GitHub style)
    function generateHistoryBars(containerId, isDown = false) {
      const container = document.getElementById(containerId);
      container.innerHTML = '';
      
      // Geramos 40 barras para um visual denso
      for (let i = 0; i < 40; i++) {
        const bar = document.createElement('div');
        bar.className = 'bar';
        
        // Simular pequenas falhas aleatórias no passado para realismo
        const rand = Math.random();
        if (rand > 0.98) bar.className = 'bar down';
        else if (rand > 0.95) bar.className = 'bar warn';

        // A última barra representa o status REAL de agora
        if (i === 39) {
          bar.className = isDown ? 'bar down' : 'bar';
        }
        
        container.appendChild(bar);
      }
    }

    async function fetchStatus() {
      const indicator = document.getElementById('statusIndicator');
      const statusText = document.getElementById('statusText');
      const dot = document.getElementById('statusDot');

      try {
        const [statusRes, guildsRes, usersRes] = await Promise.all([
          fetch('https://punbot.xyz/api/bot/status'),
          fetch('https://punbot.xyz/api/bot/guilds').catch(() => ({ json: () => ({ count: 0 }) })),
          fetch('https://punbot.xyz/api/bot/users').catch(() => ({ json: () => ({ count: 0 }) }))
        ]);

        const statusData = await statusRes.json();
        const guildsData = await guildsRes.json();
        const usersData = await usersRes.json();

        // Verificação de Status
        const isOnline = statusData.online === true || statusData.status === "online" || statusRes.ok;

        // Atualizar Banner Principal
        if (isOnline) {
          indicator.className = "status-indicator status-operational";
          statusText.textContent = "Sistemas Operacionais";
          dot.style.backgroundColor = "var(--online)";
          
          document.getElementById('botStatusBadge').innerHTML = 'Normal <i data-lucide="check-circle-2" style="width:14px"></i>';
          document.getElementById('botStatusBadge').style.color = "var(--online)";
        } else {
          indicator.className = "status-indicator status-offline";
          statusText.textContent = "Instabilidade Detectada";
          dot.style.backgroundColor = "var(--offline)";
          
          document.getElementById('botStatusBadge').innerHTML = 'Offline <i data-lucide="alert-circle" style="width:14px"></i>';
          document.getElementById('botStatusBadge').style.color = "var(--offline)";
        }

        // Atualizar Números
        document.getElementById('guildsCount').textContent = `${(guildsData.count || 0).toLocaleString('pt-BR')} Servidores`;
        document.getElementById('usersCount').textContent = `${(usersData.count || 0).toLocaleString('pt-BR')} Usuários`;

        // Gerar as barras visuais
        generateHistoryBars('botBars', !isOnline);
        generateHistoryBars('apiBars', !isOnline);
        lucide.createIcons();

        // Update Time
        const now = new Date();
        document.getElementById('updatedTime').textContent = `${now.getHours().toString().padStart(2, '0')}:${now.getMinutes().toString().padStart(2, '0')}`;

      } catch (err) {
        console.error(err);
        statusText.textContent = "Erro de Conexão";
        indicator.className = "status-indicator status-offline";
      }
    }

    fetchStatus();
    setInterval(fetchStatus, 60000);
  </script>

</body>
</html>
