<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Punishment Status</title>
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --primary-red: #ff3b3b;
      --card-bg: #111114;
      --border: rgba(255, 255, 255, 0.08);
    }

    body {
      background: var(--bg-dark);
      color: #fff;
      font-family: 'Inter', -apple-system, sans-serif;
      margin: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      min-height: 100vh;
      overflow-x: hidden;
    }

    /* Header com sua identidade */
    .header { text-align: center; padding: 40px 20px 20px; }
    .logo { width: 75px; border-radius: 18px; margin-bottom: 12px; border: 2px solid var(--border); }
    h1 { font-size: 2.2rem; color: var(--primary-red); margin: 0; font-weight: 800; letter-spacing: -1px; }
    .subtitle { color: #71717a; font-size: 0.9rem; margin-top: 5px; }

    /* Container Mágico que esconde o 'Powered By' */
    .status-wrapper {
      width: 95%;
      max-width: 800px;
      height: 750px; /* Ajuste conforme a quantidade de monitores */
      background: var(--card-bg);
      border: 1px solid var(--border);
      border-radius: 24px;
      overflow: hidden; /* Esconde o que sai da borda */
      position: relative;
      margin-bottom: 40px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.4);
    }

    /* O Iframe fica maior que o container para o rodapé sumir lá embaixo */
    iframe {
      width: 100%;
      height: 900px; /* Altura maior para empurrar o 'Powered by' para fora */
      border: none;
      position: absolute;
      top: -60px; /* Esconde o cabeçalho original do Better Stack se quiser */
      left: 0;
    }

    /* Overlay para bloquear cliques indesejados no topo (opcional) */
    .click-blocker {
      position: absolute;
      top: 0;
      width: 100%;
      height: 60px;
      z-index: 10;
      background: var(--card-bg);
    }

    footer { 
      padding: 40px; 
      text-align: center; 
      font-size: 0.8rem; 
      color: #3f3f46; 
      border-top: 1px solid var(--border);
      width: 100%;
    }
    
    .dev { color: #9C6ADE; text-decoration: none; font-weight: bold; }

    @media (max-width: 600px) {
      .status-wrapper { height: 1100px; } /* Mobile precisa de mais altura */
      iframe { height: 1300px; }
    }
  </style>
</head>
<body>

  <header class="header">
    <img src="../logo.png" class="logo" onerror="this.src='https://ui-avatars.com/api/?name=P&background=ff3b3b&color=fff'">
    <h1>Punishment</h1>
    <div class="subtitle">Monitoramento</div>
  </header>

  <div class="status-wrapper">
    <iframe 
      src="https://status.punbot.xyz" 
      loading="lazy"
      scrolling="no">
    </iframe>
  </div>

  <footer>
    <p>© 2026 Punishment. Todos os direitos reservados.</p>
    <p>dev by <a href="https://funczero.xyz" class="dev">FuncZero</a></p>
  </footer>

</body>
</html>
