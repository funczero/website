<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Punishment Status</title>

  <script src="https://unpkg.com/lucide@latest"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg-dark: #0a0a0c;
      --bg-gradient: radial-gradient(circle at center, #111116 0%, #0a0a0c 100%);
      --primary-red: #ff3b3b;
      --text-main: #ffffff;
      --text-muted: #a1a1aa;
      --online: #43b581;
      --offline: #f04747;
      --card-bg: rgba(255, 255, 255, 0.02);
      --card-border: rgba(255, 255, 255, 0.05);
      --border-soft: rgba(255, 255, 255, 0.05);
      --funczero-purple: #9C6ADE;
    }

    * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Inter', sans-serif; }

    body {
      background-color: var(--bg-dark);
      background-image: var(--bg-gradient);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* HEADER */
    .nav-header {
      width: 100%;
      max-width: 900px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 20px;
      margin-top: 20px;
    }

    .logo { width: 40px; height: 40px; border-radius: 10px; }

    .btn-contact {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      color: var(--text-main);
      padding: 8px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      transition: 0.2s;
    }
    .btn-contact:hover { background: var(--card-border); }

    /* BANNER PRINCIPAL */
    .main-banner {
      width: calc(100% - 40px);
      max-width: 860px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      padding: 24px;
      border-radius: 12px;
      display: flex;
      align-items: center;
      gap: 15px;
      margin-bottom: 30px;
    }

    .main-banner.online { border-left: 4px solid var(--online); }
    .main-banner.offline { border-left: 4px solid var(--offline); }

    .banner-icon { width: 24px; height: 24px; color: var(--online); }
    .banner-text { font-size: 1.5rem; font-weight: 700; }

    /* LISTA DE SERVIÇOS */
    .status-container {
      width: calc(100% - 40px);
      max-width: 860px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 12px;
      overflow: hidden;
      margin-bottom: 60px;
    }

    .service-block {
      padding: 24px;
      border-bottom: 1px solid var(--card-border);
    }
    .service-block:last-child { border-bottom: none; }

    .service-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 20px;
    }

    .service-name { font-weight: 600; color: var(--text-muted); font-size: 0.9rem; }

    .status-pill {
      display: flex;
      align-items: center;
      gap: 6px;
      font-size: 0.75rem;
      font-weight: 600;
      padding: 4px 10px;
      border-radius: 20px;
      background: rgba(67, 181, 129, 0.1);
      color: var(--online);
    }

    .monitor-info {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }
    .monitor-name { display: flex; align-items: center; gap: 8px; font-weight: 600; }
    .monitor-uptime { color: var(--online); font-size: 0.85rem; font-weight: 500; }

    /* HISTÓRICO (BARRINHAS) */
    .history-bar {
      display: grid;
      grid-template-columns: repeat(30, 1fr);
      gap: 3px;
      height: 30px;
      margin-bottom: 8px;
    }
    .history-rect {
      background: var(--online);
      border-radius: 2px;
      opacity: 0.8;
      transition: 0.2s;
    }
    .history-rect:hover { opacity: 1; transform: scaleY(1.1); }
    .history-rect.down { background: var(--offline); }

    .history-labels {
      display: flex;
      justify-content: space-between;
      color: #555;
      font-size: 0.75rem;
    }

    /* FOOTER */
    footer {
      width: 100%;
      padding: 20px;
      text-align: center;
      font-size: 0.75rem;
      border-top: 1px solid var(--border-soft);
      margin-top: auto;
    }
    .footer-links { margin-bottom: 10px; display: flex; justify-content: center; gap: 18px; }
    .footer-links a { color: var(--text-muted); text-decoration: none; }
    .dev-signature a { font-weight: 700; color: var(--funczero-purple); text-decoration: none; }

    @media (max-width: 600px) {
        .banner-text { font-size: 1.1rem; }
        .history-bar { gap: 2px; }
    }
  </style>
</head>
<body>

  <header class="nav-header">
    <img src="../logo.png" alt="P" class="logo" onerror="this.src='https://ui-avatars.com/api/?name=P&background=ff3b3b&color=fff'">
    <button class="btn-contact">Get in touch <i data-lucide="chevron-down"></i></button>
  </header>

  <div id="statusBanner" class="main-banner online">
    <i data-lucide="check-circle-2" class="banner-icon" id="bannerIcon"></i>
    <span class="banner-text" id="bannerText">Todos os sistemas operacionais</span>
  </div>

  <main class="status-container" id="statusList">
    <div style="padding: 40px; text-align: center; color: var(--text-muted);">Sincronizando serviços...</div>
  </main>

  <footer>
    <div class="footer-links">
      <a href="../terms">Termos</a>
      <a href="../privacy">Privacidade</a>
      <a href="../status">Status</a>
    </div>
    <p>© 2026 Punishment. All rights reserved.</p>
    <p class="dev-signature" style="margin-top:8px">Dev by <a href="https://funczero.xyz" target="_blank">FuncZero</a></p>
  </footer>

  <script>
    lucide.createIcons();

    async function loadStatus() {
      try {
        const response = await fetch('https://status.punbot.xyz/status-page/v2/services.json');
        const data = await response.json();
        
        const listContainer = document.getElementById('statusList');
        const banner = document.getElementById('statusBanner');
        const bannerText = document.getElementById('bannerText');
        const bannerIcon = document.getElementById('bannerIcon');

        listContainer.innerHTML = ''; // Limpa o carregando

        // 1. Atualiza o Banner Geral
        const allUp = data.services.every(s => s.status === 'up');
        if (!allUp) {
          banner.className = "main-banner offline";
          bannerText.textContent = "Instabilidade Detectada";
          bannerIcon.style.color = "var(--offline)";
          bannerIcon.setAttribute('data-lucide', 'alert-circle');
        }

        // 2. Gera os Blocos de Serviço (Bot, API, Database, etc)
        data.services.forEach(service => {
          const isUp = service.status === 'up';
          const statusLabel = isUp ? 'Operational' : 'Down';
          const uptimeVal = service.uptime || "100%"; // Simulação se o JSON não trouxer

          const html = `
            <div class="service-block">
              <div class="service-header">
                <span class="service-name">${service.name.split(' ')[0]}</span> <div class="status-pill" style="color: ${isUp ? 'var(--online)' : 'var(--offline)'}; background: ${isUp ? 'rgba(67, 181, 129, 0.1)' : 'rgba(240, 71, 71, 0.1)'}">
                  <i data-lucide="check-circle-2" style="width:12px"></i> ${statusLabel}
                </div>
              </div>

              <div class="monitor-info">
                <div class="monitor-name">
                  <i data-lucide="check-circle-2" style="width:16px; color: var(--online)"></i>
                  ${service.name}
                </div>
                <div class="monitor-uptime">${uptimeVal} uptime</div>
              </div>

              <div class="history-bar">
                ${generateHistoryBars(isUp)}
              </div>

              <div class="history-labels">
                <span>30 days ago</span>
                <span>Today</span>
              </div>
            </div>
          `;
          listContainer.innerHTML += html;
        });

        lucide.createIcons();

      } catch (error) {
        console.error("Erro:", error);
      }
    }

    // Função para gerar as 30 barrinhas
    function generateHistoryBars(isCurrentUp) {
      let bars = '';
      for (let i = 0; i < 30; i++) {
        // Simulando que as últimas barras são o status atual
        // Em um sistema real, você mapearia os 'events' do JSON do Better Stack aqui
        const statusClass = (i === 29 && !isCurrentUp) ? 'down' : ''; 
        bars += `<div class="history-rect ${statusClass}"></div>`;
      }
      return bars;
    }

    loadStatus();
    setInterval(loadStatus, 60000);
  </script>
</body>
</html>
