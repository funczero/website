<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Punishment Status</title>
  <style>
    :root {
      --bg-dark: #0a0a0c;
      --primary-red: #ff3b3b;
      --text-main: #ffffff;
      --card-bg: rgba(255, 255, 255, 0.03);
      --card-border: rgba(255, 255, 255, 0.1);
    }

    body {
      background: var(--bg-dark);
      color: var(--text-main);
      font-family: 'Inter', -apple-system, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 50px 20px;
      min-height: 100vh;
      margin: 0;
    }

    .header { text-align: center; margin-bottom: 30px; }
    .logo { width: 70px; border-radius: 15px; margin-bottom: 10px; }
    h1 { font-size: 2rem; color: var(--primary-red); margin: 10px 0; }

    .status-container {
      width: 100%;
      max-width: 500px;
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 20px;
      padding: 30px;
      text-align: center;
    }

    .card-header {
      color: #a1a1aa;
      font-size: 0.8rem;
      letter-spacing: 1px;
      font-weight: 700;
      margin-bottom: 25px;
      text-transform: uppercase;
    }

    .badge-wrapper {
      display: flex;
      flex-direction: column;
      gap: 20px;
      align-items: center;
    }

    .monitor-row {
      display: flex;
      justify-content: space-between;
      align-items: center;
      width: 100%;
      padding-bottom: 15px;
      border-bottom: 1px solid rgba(255,255,255,0.05);
    }

    .monitor-row:last-child { border-bottom: none; }

    .monitor-label {
      font-size: 0.9rem;
      font-weight: 500;
      color: #e4e4e7;
    }

    iframe {
      border: none;
      pointer-events: none;
    }

    footer { 
      margin-top: auto; 
      padding: 40px; 
      text-align: center; 
      font-size: 0.8rem; 
      color: #444; 
    }
    
    .dev { color: #9C6ADE; text-decoration: none; font-weight: bold; }
  </style>
</head>
<body>

  <header class="header">
    <img src="../logo.png" class="logo" onerror="this.src='https://ui-avatars.com/api/?name=P&background=ff3b3b&color=fff'">
    <h1>Punishment</h1>
  </header>

  <main class="status-container">
    <div class="card-header">Monitoramento em Tempo Real</div>

    <div class="badge-wrapper">
      <div class="monitor-row">
        <span class="monitor-label">STATUS GERAL:</span>
        <iframe src="https://status.punbot.xyz/badge?theme=dark" width="200" height="30"></iframe>
      </div>

      <div class="monitor-row">
        <span class="monitor-label">BOT CLIENT:</span>
        <iframe src="https://status.punbot.xyz/badge?theme=dark" width="200" height="30"></iframe>
      </div>
      
      <div class="monitor-row">
        <span class="monitor-label">API CORE:</span>
        <iframe src="https://status.punbot.xyz/badge?theme=dark" width="200" height="30"></iframe>
      </div>
    </div>
  </main>

  <footer>
    <p>© 2026 Punishment. Todos os direitos reservados.</p>
    <p>Dev by <a href="https://funczero.xyz" class="dev">FuncZero</a></p>
  </footer>

</body>
</html>
