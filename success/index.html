<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Pagamento aprovado</title>

  <link rel="icon" type="image/png" href="/assets/images/punbot.logo.png">
  <link rel="apple-touch-icon" href="/assets/images/punbot.logo.png">
  
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">

<style>
:root {
  --bg-dark:#0a0a0c;
  --bg-gradient:radial-gradient(circle at center,#111116 0%,#0a0a0c 100%);
  --primary-red:#ef4444;
  --primary-red-hover:#dc2626;
  --text-main:#ffffff;
  --text-muted:#a1a1aa;
  --border-soft:rgba(255,255,255,0.05);
  --funczero-purple:#9C6ADE;
}

*{
box-sizing:border-box;
margin:0;
padding:0;
font-family:'Inter',system-ui,-apple-system,sans-serif;
}

html,body{
height:100%;
width:100%;
overflow:hidden;
}

body{
background-color:var(--bg-dark);
background-image:var(--bg-gradient);
color:var(--text-main);
display:flex;
flex-direction:column;
align-items:center;
justify-content:center;
position:relative;
}

.glow-orb{
position:absolute;
border-radius:50%;
filter:blur(120px);
opacity:.25;
animation:float 12s infinite ease-in-out alternate;
}

.orb-1{
width:400px;
height:400px;
background:rgba(239,68,68,.15);
top:-150px;
left:-100px;
}

@keyframes float{
0%{transform:translateY(0)}
100%{transform:translateY(40px)}
}

.container{
width:100%;
max-width:600px;
padding:20px;
z-index:1;
text-align:center;
}

.logo{
width:240px;
height:240px;
object-fit:cover;
margin-bottom:4px;
border-radius:22px;
}

h1{
font-size:2.3rem;
font-weight:800;
margin-bottom:12px;
letter-spacing:-1px;
color:var(--primary-red);
}

.subtitle{
color:var(--text-muted);
margin-bottom:35px;
line-height:1.6;
font-size:.95rem;
max-width:420px;
margin-left:auto;
margin-right:auto;
}

footer{
width:100%;
padding:20px;
text-align:center;
font-size:.75rem;
color:#555;
border-top:1px solid var(--border-soft);
position:absolute;
bottom:0;
background:var(--bg-dark);
}

.footer-links{
margin-bottom:10px;
display:flex;
justify-content:center;
gap:18px;
flex-wrap:wrap;
}

.footer-links a{
color:var(--text-muted);
text-decoration:none;
}

.footer-links a:hover{
color:var(--primary-red);
}

.dev-signature{
margin-top:8px;
color:#777;
font-size:.8rem;
}

.dev-signature a{
text-decoration:none;
font-weight:700;
color:var(--funczero-purple);
}
</style>
</head>

<body>

<div class="glow-orb orb-1"></div>

<div class="container">

<img src="/assets/images/logo.png" class="logo">

<h1>Pagamento aprovado</h1>

<p class="subtitle">
Obrigado por apoiar o projeto <strong>Punishment</strong>.<br>
Sua contribuição ajuda a manter o bot online e em constante evolução.
</p>

</div>

<footer>
<div class="footer-links">
<a href="/terms">Termos</a>
<a href="/privacy">Privacidade</a>
<a href="/status">Status</a>
</div>

<p>© 2026 Punishment. All rights reserved.</p>
<p class="dev-signature">Dev by <a href="https://funczero.xyz" target="_blank">FuncZero</a></p>
</footer>

</body>
</html>
